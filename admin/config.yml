backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "المنتجات والأعمال"
    folder: "content/products"
    create: true
    fields:
      - {label: "عنوان المنتج", name: "title", widget: "string"}
      - {label: "الصورة", name: "image", widget: "image"}
      - {label: "الوصف", name: "description", widget: "text"}
